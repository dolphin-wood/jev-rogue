<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animation Lab</title>
  <style>
    :root { color-scheme: dark; --bg: #14121f; --panel: #1c1a2b; --line: #3a3654; --text: #e8e3d8; --dim: #8792b5; --accent: #8fdcff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 ui-monospace, monospace; }
    main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; min-height: 100vh; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    aside { background: var(--panel); border: 1px solid var(--line); padding: 12px; align-self: start; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    h2 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
    button, select { background: #221f33; color: var(--text); border: 1px solid #4a4666; padding: 5px 9px; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #3b3558; border-color: var(--accent); }
    label { display: flex; gap: 6px; align-items: center; color: #c9cfe8; }
    input[type=range] { flex: 1; min-width: 0; }
    .stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .views { display: flex; gap: 12px; flex-wrap: wrap; }
    figure { margin: 0; }
    figcaption { color: var(--dim); margin-top: 4px; }
    canvas { display: block; image-rendering: pixelated; max-width: 100%; border: 1px solid var(--line); }
    .hint { color: var(--dim); font-size: 12px; }
    #strip { overflow-x: auto; }
    .joint { display: grid; grid-template-columns: 70px 1fr 40px; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>Animation Lab</h1>
      <div class="hint">Rigs, enemy frames and effects, played the way the game would draw them.</div>
      <h2>Subject</h2>
      <div class="row" id="kinds"></div>
      <div class="row"><select id="subject"></select></div>
      <div class="row" id="moves"></div>
      <div class="row" id="facing"></div>
      <h2>Playback</h2>
      <div class="row"><button id="play">pause</button><button id="step">step ▸</button><button id="restart">restart</button></div>
      <label>speed <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1" /> <span id="speedv">1×</span></label>
      <label>frame rate <select id="fps"><option value="60">60 (smooth)</option><option value="24">24</option><option value="12" selected>12 (on twos)</option><option value="8">8</option></select></label>
      <label>zoom <input type="range" id="zoom" min="2" max="10" step="1" value="6" /></label>
      <label>background <select id="bg"><option value="floor">floor</option><option value="dark">dark</option><option value="check">checker</option></select></label>
      <div id="rigopts">
        <h2>Rig rendering</h2>
        <label><input type="checkbox" id="pixel" checked /> at art resolution (the game's view)</label>
        <label>angle steps <select id="steps"><option value="0">none</option><option value="64">64 (5.6°)</option><option value="32" selected>32 (11.25°)</option><option value="16">16 (22.5°)</option></select></label>
        <label><input type="checkbox" id="snap" checked /> positions to whole pixels</label>
        <label><input type="checkbox" id="clean" checked /> clean rotation (RotSprite-style)</label>
        <label><input type="checkbox" id="joints" /> show joints</label>
        <label><input type="checkbox" id="compare" checked /> frames alongside</label>
        <h2>Control</h2>
        <div class="hint">Click the stage, then WASD to walk, J swing, K cast, H hurt. Released, it plays the chosen move.</div>
        <h2>Joints (added to the move)</h2>
        <div id="jointSliders"></div>
        <div class="row"><button id="zeroJoints">zero joints</button></div>
      </div>
      <div id="fxopts">
        <h2>Effect</h2>
        <label>angle <input type="range" id="fxAngle" min="-180" max="180" step="1" value="0" /> <span id="fxAnglev">0°</span></label>
        <label>ms per frame <input type="range" id="fxMs" min="16" max="200" step="2" value="45" /> <span id="fxMsv">45</span></label>
      </div>
    </aside>
    <section class="stage">
      <div class="views">
        <figure><canvas id="main" tabindex="0"></canvas><figcaption id="mainCap"></figcaption></figure>
        <figure id="cmpFig"><canvas id="cmp"></canvas><figcaption>the delivered frames, same move</figcaption></figure>
      </div>
      <div id="strip"><canvas id="stripCanvas"></canvas></div>
      <div class="hint" id="status"></div>
    </section>
  </main>
  <script type="module" src="/src/anim-lab.ts"></script>
</body>
</html>
